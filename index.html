<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>대출연락</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 16px;
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background-color: #ffffff;
            color: #222222;
        }

        h1 {
            font-size: xx-large;
            line-height: 1.4;
            margin: 0 0 16px;
            overflow-wrap: break-word;
        }

        .content {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        .image-section {
            margin-bottom: 120px;
        }

        .image-section:last-child {
            margin-bottom: 32px;
        }

        img {
            display: block;
            width: 100%;
            max-width: 100%;
            height: auto;
            object-fit: contain;
            border-radius: 4px;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            h1 {
                font-size: 23px;
            }

            .image-section {
                margin-bottom: 100px;
            }
        }
    </style>
</head>

<body>
    <main class="content">

        <section class="image-section">
            <h1 style="font-size: xx-large;">나한테 온 연락</h1>

            <img
                src="https://mblogthumb-phinf.pstatic.net/MjAyNjEwMzFfOTMg/MDAxNzkzNDQ2MzUyNzg5.FHjlj2vLHZjsNsl-QIyNFknRre8jzIH6OhUOHWF3uh8g.Cjsm83u8HM1ggpcL5q78TGqEvV5hjJZUMVUXDUhbwQQg.JPEG/900_Screenshot_20261031_202603_Naver_Blog.jpg?type=w800"
                alt="나한테 온 연락 화면"
                loading="eager"
            >
        </section>
        <hr style="border: none; height: 3px; background-color: black;"><br><br>
        <section class="image-section">
            <h1 style="font-size: xx-large;">연우한테 온 연락 (2026.10.31)</h1>

            <img
                src="https://mblogthumb-phinf.pstatic.net/MjAyNjEwMzFfMjYg/MDAxNzkzNDQ2MzUyMTI2.ILlJpMIXxqJCN4LEsNfRq1eLfbDnSZzIku85VOTgNHcg.zoKXgim2uyfyvAGSIKbV7yrr46wGKQI80qzM4aAVtr0g.JPEG/900_IMG_20261031_202113_221.jpg?type=w800"
                alt="연우한테 온 연락 화면"
                loading="lazy"
            >
        </section>

    </main>
</body>
</html>
